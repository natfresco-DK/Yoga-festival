<!doctype html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilmeld aktiviteter | Yogafestivalen</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/registration.js}" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container header-content">
        <a th:href="@{/activities}" class="brand">Yogafestivalen</a>
    </div>
</header>

<main class="container">
    <div class="page-heading">
        <p class="eyebrow">Tilmelding</p>
        <h1>Tilmeld deltager</h1>
        <p>Registrer deltageren og vælg én eller flere aktiviteter.</p>
    </div>

    <form id="registration-form" class="panel registration-layout">
        <section>
            <div class="panel-heading">
                <h2>Deltageroplysninger</h2>
                <p>Felter markeret med * skal udfyldes.</p>
            </div>

            <div class="field">
                <label for="name">Navn *</label>
                <input id="name" name="name" type="text" maxlength="100" required>
            </div>
            <div class="field">
                <label for="email">E-mail *</label>
                <input id="email" name="email" type="email" maxlength="255" required>
            </div>
            <div class="field">
                <label for="phoneNumber">Telefonnummer</label>
                <input id="phoneNumber" name="phoneNumber" type="tel" maxlength="30">
            </div>
            <div class="field">
                <label for="festivalId">Festival *</label>
                <select id="festivalId" name="festivalId" required>
                    <option value="">Vælg festival</option>
                </select>
            </div>
        </section>

        <section>
            <div class="panel-heading">
                <h2>Aktiviteter</h2>
                <p>Vælg de aktiviteter, deltageren vil deltage i.</p>
            </div>
            <div id="activity-options" class="activity-options">
                <p>Vælg en festival for at se aktiviteter.</p>
            </div>
        </section>

        <p class="message" id="registration-message" role="status" aria-live="polite" hidden></p>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Tilmed deltager</button>
            <button class="btn btn-secondary" type="reset">Ryd felter</button>
        </div>
    </form>
</main>
</body>
</html>
